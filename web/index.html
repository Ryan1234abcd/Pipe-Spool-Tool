<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pipe Spool Tool</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 6h8a2 2 0 0 1 2 2v7h4V8a6 6 0 0 0-6-6H1z%22 fill=%22%23e8792b%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Pipe Spool Tool</div>
  <div id="engine" class="engine" hidden>Loading CAD engine…</div>
  <div class="project">
    <input id="projectName" value="Spool-01" title="Spool name (used for the STEP file)" aria-label="Spool name">
    <button id="btnNew" title="New spool">New</button>
    <button id="btnOpen" title="Open a saved spool">Open…</button>
    <button id="btnSave" title="Save the spool in this browser (Ctrl+S)">Save</button>
    <button id="btnBom" title="Parts list and pipe cut list">BOM</button>
    <button id="btnExport" class="primary" title="Build and download one STEP file">Export STEP</button>
  </div>
</header>

<main>
  <section id="tab-builder" class="tab active">
    <aside class="left">
      <div class="panel">
        <h3>Part library</h3>
        <div id="libFolder" class="libfolder"></div>
        <div class="row">
          <button id="btnOpenLib" title="Choose your Part-Library folder (the one with library.json)">Open Part-Library…</button>
          <button id="btnReconnect" hidden title="Open the folder you used last time">Reconnect</button>
        </div>
        <input type="file" id="libInput" webkitdirectory directory multiple hidden>
      </div>
      <div class="panel grow">
        <h3>Add a part</h3>
        <div id="nextEnd" class="next-end"></div>
        <label id="pipeTypeRow" class="inline-row">Pipe type <select id="selType"></select></label>
        <label id="startSizeRow" class="inline-row">Start size <select id="selStart"></select></label>
        <label id="startDirRow" class="inline-row">Start <select id="selDir">
          <option value="+X">Horizontal (along X)</option><option value="+Y">Horizontal (along Y)</option>
          <option value="+Z">Vertical, going up</option><option value="-Z">Vertical, going down</option>
        </select></label>
        <input id="partSearch" placeholder="Search… (F)" class="search" aria-label="Search parts">
        <div id="groupChips" class="chips" role="radiogroup" aria-label="Part type"></div>
        <div id="partList" class="list"></div>
      </div>
    </aside>

    <div class="viewport-wrap">
      <div class="view-toolbar">
        <button data-view="iso" title="Isometric">Iso</button>
        <button data-view="top">Top</button>
        <button data-view="front">Front</button>
        <button data-view="right">Right</button>
        <button id="btnFit" title="Zoom to fit (Home)">Fit</button>
        <span class="sep"></span>
        <label><input type="checkbox" id="chkDims" checked> Dimensions</label>
        <span class="sep"></span>
        <button id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
        <button id="btnRedo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
      </div>
      <div id="viewport" class="viewport"></div>
      <div id="status" class="status"></div>
    </div>

    <aside class="right">
      <div class="panel" id="props"></div>
      <div class="panel grow">
        <h3 class="head-row">Spool <button id="btnStartPt" title="Start another run from a point X/Y/Z from the spool origin (S)">+ Start point</button></h3>
        <div id="tree" class="list tree"></div>
      </div>
    </aside>
  </section>
</main>

<dialog id="dlgOpen">
  <h3>Open spool</h3>
  <div id="projectList" class="list"></div>
  <div class="row">
    <label class="file-btn">Import .json…<input type="file" id="importJson" accept=".json"></label>
    <button id="btnDownloadJson" title="Download the current spool as a .json file">Download current .json</button>
    <span class="grow"></span>
    <button data-close>Close</button>
  </div>
</dialog>

<dialog id="dlgBom">
  <h3>Bill of materials</h3>
  <div id="bomBody"></div>
  <div class="row">
    <button id="bomCsv">Download CSV</button>
    <span class="grow"></span>
    <button data-close>Close</button>
  </div>
</dialog>

<dialog id="dlgExport" class="export">
  <h3>Export STEP</h3>
  <div class="levels" role="radiogroup" aria-label="Level of detail">
    <label><input type="radio" name="expLevel" value="envelope"> <b>Envelope</b> <span class="hint">smallest file: smooth outlines, a block for each handle</span></label>
    <label><input type="radio" name="expLevel" value="wrap" checked> <b>Shrink-wrap</b> <span class="hint">follows each part's outline at the resolution below</span></label>
    <label><input type="radio" name="expLevel" value="full"> <b>Full model</b> <span class="hint">the original STEP geometry, largest file</span></label>
  </div>
  <label id="expResRow" class="res-row">Resolution
    <input type="range" id="expRes" min="1" max="50" step="1" value="5" aria-label="Resolution in millimetres">
    <output id="expResOut">5 mm</output>
    <span class="hint">smaller = closer fit, more faces</span>
  </label>
  <label id="expHollowRow"><input type="checkbox" id="expHollow"> Hollow pipes (show the bore)</label>
  <label title="For the Dynamo graph in the tool's revit/ folder, which adds a pipe connector at each open end in a Revit family"><input type="checkbox" id="expConn" checked> Revit connector file (.json, for the Dynamo graph)</label>
  <div class="export-preview">
    <div id="expView" class="viewport"></div>
    <div id="expStats" class="hint"></div>
  </div>
  <div class="row">
    <button id="expBuild">Build preview</button>
    <span class="grow"></span>
    <button data-close>Close</button>
    <button id="expGo" class="primary">Download STEP</button>
  </div>
  <div id="expMsg" class="hint"></div>
</dialog>

<div id="toast" role="status"></div>
</body>
</html>
